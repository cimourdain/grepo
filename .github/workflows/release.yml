# Opens/updates a "release PR" on every push to main that accumulates pending Conventional Commits
# into a version bump + CHANGELOG.md entry; merging that PR tags and publishes the GitHub release.
# See https://github.com/googleapis/release-please for the full workflow.
#
# When a push creates a release (the release PR was just merged), the `build-linux` and
# `build-windows` (on a Windows runner) jobs build the Linux AppImage and the Windows installer and
# portable executable from the release's tag and attach them to that release as `Grepo-<version>.AppImage`,
# `Grepo-Setup-<version>.exe` and `Grepo-<version>-portable.exe`. They run in this workflow, gated
# on release-please's `release_created` output, because a release created with the default
# GITHUB_TOKEN does not trigger other workflows' `release` events. Their setup is shared with the
# checks (ci.yml) in .github/actions/setup-build. The packages are not signed.
#
# Releases are configured by files, read from the repository: .release/release-please-config.json
# (release type, package name and the emoji-prefixed CHANGELOG sections per Conventional Commits
# type) and .release/release-please-manifest.json (the last released version). In this manifest
# mode, the `release_created` / `tag_name` outputs describe the root package (`.`).
#
# The repository's Settings → Actions → General → Workflow permissions must allow GitHub Actions
# to create pull requests, for release-please to open the release PR.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release/release-please-config.json
          manifest-file: .release/release-please-manifest.json

  build-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ./.github/actions/setup-build

      - name: Build the AppImage
        run: pnpm build:linux

      - name: Attach the AppImage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/Grepo-*.AppImage --clobber

  # On a Windows runner: electron-builder's NSIS target needs Wine to build from Linux. The shell
  # is bash, so that `gh release upload` gets its file patterns expanded.
  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ./.github/actions/setup-build

      - name: Build the installer and the portable executable
        run: pnpm build:win

      - name: Attach the installer and the portable executable to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/Grepo-Setup-*.exe dist/Grepo-*-portable.exe --clobber
